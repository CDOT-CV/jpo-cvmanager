opencollection: 1.0.0

info:
  name: Intersection API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{KEYCLOAK_ACCESS_TOKEN}}"
  variables:
    - name: baseUrl
      value: http://localhost:8089
    - name: KEYCLOAK_ACCESS_TOKEN
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
