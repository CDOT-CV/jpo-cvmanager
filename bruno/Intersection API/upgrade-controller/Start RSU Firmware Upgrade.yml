info:
  name: Start RSU Firmware Upgrade
  type: http
  seq: 1
  tags:
    - upgrade-controller

http:
  method: POST
  url: "{{baseUrl}}/devices/rsus/upgrade"
  body:
    type: json
    data: |-
      {
        "rsu_ips": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/devices/rsus/upgrade"
      method: POST
      body:
        type: json
        data: |-
          {
            "rsu_ips": []
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "192.168.1.1": {
              "code": 200,
              "data": {
                "message": "started"
              }
            },
            "192.168.1.2": {
              "code": 409,
              "data": "already up to date"
            }
          }
