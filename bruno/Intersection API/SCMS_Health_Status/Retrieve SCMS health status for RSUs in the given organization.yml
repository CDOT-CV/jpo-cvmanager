info:
  name: Retrieve SCMS health status for RSUs in the given organization
  type: http
  seq: 1
  tags:
    - SCMS_Health_Status

http:
  method: GET
  url: "{{baseUrl}}/devices/scms/status"
  headers:
    - name: Organization
      value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

