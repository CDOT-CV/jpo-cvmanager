  type: http
  seq: 3
  tags:
    - email-controller

http:
  method: POST
  url: "{{baseUrl}}/emails/intersection-notifications"
  body:
    type: json
    data: |-
      {
        "notifications": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

