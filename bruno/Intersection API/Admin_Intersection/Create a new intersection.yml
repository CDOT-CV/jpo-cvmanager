info:
  name: Create a new intersection
  type: http
  seq: 2
  tags:
    - Admin_Intersection

http:
  method: POST
  url: "{{baseUrl}}/admin/intersections"
  body:
    type: json
    data: |-
      {
        "intersection_id": 12109,
        "ref_pt": {
          "latitude": 39.7392,
          "longitude": -104.9903
        },
        "organizations": [],
        "rsus": [],
        "bbox": {
          "latitude1": 39.74,
          "longitude1": -104.99,
          "latitude2": 39.73,
          "longitude2": -104.98
        },
        "intersection_name": "Main St & 1st Ave",
        "origin_ip": "10.0.0.1"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

