info:
  name: List intersections not in organization
  type: http
  seq: 6
  tags:
    - Admin_Intersection

http:
  method: GET
  url: "{{baseUrl}}/admin/intersections/available"
  headers:
    - name: Organization
      value: ""
      description: Organization to exclude intersections from
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success (empty list when all intersections are already in the organization)
    request:
      url: "{{baseUrl}}/admin/intersections/available"
      method: GET
      headers:
        - name: Organization
          value: ""
          description: Organization to exclude intersections from
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "intersection_data": [
              {
                "intersection_id": 12109,
                "ref_pt": {
                  "latitude": 39.7392,
                  "longitude": -104.9903
                },
                "bbox": {
                  "latitude1": 39.74,
                  "longitude1": -104.99,
                  "latitude2": 39.73,
                  "longitude2": -104.98
                },
                "intersection_name": "Main St & 1st Ave",
                "origin_ip": "192.168.1.1",
                "organizations": [],
                "rsus": []
              }
            ]
          }
