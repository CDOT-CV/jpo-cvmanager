services:
  # OBU OTA Server and Nginx proxy services
  jpo_ota_backend:
    profiles:
      - obu_ota
      - jpo_ota_backend
    build:
      context: ./services
      dockerfile: Dockerfile.obu_ota_server
    image: obu_ota_server:latest
    restart: unless-stopped
    # Published on localhost only. Remote clients connect through NGINX, which reaches
    # the backend over the compose network.
    ports:
      - 127.0.0.1:8085:8085
    environment:
      SERVER_HOST: ${OBU_OTA_SERVER_HOST:-}
      LOGGING_LEVEL: ${OBU_OTA_LOGGING_LEVEL:-}
      BLOB_STORAGE_PROVIDER: ${BLOB_STORAGE_PROVIDER:-DOCKER}
      BLOB_STORAGE_BUCKET: ${OBU_OTA_BLOB_STORAGE_BUCKET:-}
      BLOB_STORAGE_PATH: ${OBU_OTA_BLOB_STORAGE_PATH:-}
      GCP_PROJECT: ${OBU_OTA_GCP_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/gcp/application-default-credentials.json

      # Proxies allowed to set X-Forwarded-For. "*" is used because the NGINX container
      # address is not fixed; it is safe because only NGINX and local processes can
      # reach the backend port.
      FORWARDED_ALLOW_IPS: ${OBU_OTA_FORWARDED_ALLOW_IPS:-*}

      OTA_USERNAME: ${OTA_USERNAME:-admin}
      OTA_PASSWORD: ${OTA_PASSWORD:-admin}

      PG_DB_HOST: ${PG_DB_HOST:-cvmanager_postgres:5432}
      PG_DB_USER: ${PG_DB_USER:-postgres}
      PG_DB_PASS: ${PG_DB_PASS:-postgres}
      PG_DB_NAME: ${PG_DB_NAME:-postgres}

      MAX_COUNT: ${MAX_COUNT:-10}
      NGINX_ENCRYPTION: ${NGINX_ENCRYPTION:-plain}
    volumes:
      - ./resources/ota/firmwares:/firmwares
      - type: bind
        # The checked-in file contains no credentials. Configure a real host path to
        # serve firmware from GCS
        source: ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-./resources/google/sample_gcp_service_account.json}
        target: /var/run/secrets/gcp/application-default-credentials.json
        read_only: true
    logging:
      options:
        max-size: '10m'
        max-file: '5'

  jpo_ota_nginx:
    profiles:
      - obu_ota
      - jpo_ota_nginx
    build:
      context: resources/ota/nginx
    image: obu_ota_nginx:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      SERVER_HOST: ${OBU_OTA_SERVER_HOST:-}
    volumes:
      - ./resources/ota/nginx/nginx-${NGINX_ENCRYPTION:-plain}.conf:/etc/nginx/templates/nginx.conf.template
      - ./resources/ota/nginx/gen_dhparam.sh:/docker-entrypoint.d/gen_dhparam.sh
      - ./resources/ota/nginx/ssl/${SERVER_CERT_FILE:-ota_server.crt}:/etc/ssl/certs/ota_server.crt
      - ./resources/ota/nginx/ssl/${SERVER_KEY_FILE:-ota_server.key}:/etc/ssl/private/ota_server.key
    depends_on:
      - jpo_ota_backend
    logging:
      options:
        max-size: '10m'
        max-file: '5'
