# Create the secret before applying this deployment:
#   kubectl create secret generic iss-health-check-secrets \
#     --from-literal=ISS_TOKEN_ENCRYPTION_KEY='<fernet-key>' \
#     --from-literal=ISS_API_KEY='<initial-iss-api-key>' \
#     --from-literal=PG_DB_PASS='<postgres-password>'
apiVersion: 'apps/v1'
kind: 'Deployment'
metadata:
  name: 'iss-health-check'
  labels:
    app: 'iss-health-check'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 'iss-health-check'
  template:
    metadata:
      labels:
        app: 'iss-health-check'
    spec:
      containers:
        - name: 'iss-health-check'
          imagePullPolicy: Always
          # Replace image with an actual built iss-health-check image from an image repository
          image: 'iss-health-check-image'
          resources:
            requests:
              memory: '1Gi'
              cpu: '0.5'
          env:
            - name: ISS_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: iss-health-check-secrets
                  key: ISS_TOKEN_ENCRYPTION_KEY
            - name: ISS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iss-health-check-secrets
                  key: ISS_API_KEY
                  optional: true
            - name: ISS_API_KEY_NAME
              value: ''
            - name: ISS_PROJECT_ID
              value: ''
            - name: ISS_SCMS_TOKEN_REST_ENDPOINT
              value: ''
            - name: ISS_SCMS_VEHICLE_REST_ENDPOINT
              value: ''
            - name: PG_DB_USER
              value: ''
            - name: PG_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: iss-health-check-secrets
                  key: PG_DB_PASS
            - name: PG_DB_NAME
              value: ''
            - name: PG_DB_HOST
              value: ''
            - name: LOGGING_LEVEL
              value: 'INFO'
