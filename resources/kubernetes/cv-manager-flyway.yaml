# ConfigMap containing Flyway migration SQL files.
# Add a new key here for each migration added to resources/db/migration/.
# R__sample_data.sql is intentionally excluded — it is dev-only seed data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-sql
data:
  V1__baseline.sql: |
    -- V1__baseline.sql
    -- Full current schema for CV Manager PostgreSQL database.
    -- Represents the end-state of CVManager_CreateTables.sql + all 19 update_scripts.
    -- Existing live databases are stamped at this version via baselineOnMigrate=true
    -- and are NOT re-migrated by this script.

    BEGIN;

    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE SCHEMA IF NOT EXISTS keycloak;

    CREATE SEQUENCE public.manufacturers_manufacturer_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.manufacturers
    (
       manufacturer_id integer NOT NULL DEFAULT nextval('manufacturers_manufacturer_id_seq'::regclass),
       name character varying(128) COLLATE pg_catalog.default NOT NULL,
       CONSTRAINT manufacturers_pkey PRIMARY KEY (manufacturer_id),
       CONSTRAINT manufacturers_name UNIQUE (name)
    );

    CREATE SEQUENCE public.rsu_models_rsu_model_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.rsu_models
    (
       rsu_model_id integer NOT NULL DEFAULT nextval('rsu_models_rsu_model_id_seq'::regclass),
       name character varying(128) COLLATE pg_catalog.default NOT NULL,
       supported_radio character varying(128) COLLATE pg_catalog.default NOT NULL,
       manufacturer integer NOT NULL,
       CONSTRAINT rsu_models_pkey PRIMARY KEY (rsu_model_id),
       CONSTRAINT rsu_models_name UNIQUE (name),
       CONSTRAINT fk_manufacturer FOREIGN KEY (manufacturer)
          REFERENCES public.manufacturers (manufacturer_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.firmware_images_firmware_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.firmware_images
    (
       firmware_id integer NOT NULL DEFAULT nextval('firmware_images_firmware_id_seq'::regclass),
       name character varying(128) COLLATE pg_catalog.default NOT NULL,
       model integer NOT NULL,
       install_package character varying(128) COLLATE pg_catalog.default NOT NULL,
       version character varying(128) COLLATE pg_catalog.default NOT NULL,
       CONSTRAINT firmware_images_pkey PRIMARY KEY (firmware_id),
       CONSTRAINT firmware_images_name UNIQUE (name),
       CONSTRAINT firmware_images_install_package UNIQUE (install_package),
       CONSTRAINT firmware_images_version UNIQUE (version),
       CONSTRAINT fk_model FOREIGN KEY (model)
          REFERENCES public.rsu_models (rsu_model_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.firmware_upgrade_rules_firmware_upgrade_rule_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.firmware_upgrade_rules
    (
       firmware_upgrade_rule_id integer NOT NULL DEFAULT nextval('firmware_upgrade_rules_firmware_upgrade_rule_id_seq'::regclass),
       from_id integer NOT NULL,
       to_id integer NOT NULL,
       CONSTRAINT firmware_upgrade_rules_pkey PRIMARY KEY (firmware_upgrade_rule_id),
       CONSTRAINT fk_from_id FOREIGN KEY (from_id)
          REFERENCES public.firmware_images (firmware_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_to_id FOREIGN KEY (to_id)
          REFERENCES public.firmware_images (firmware_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.organizations_organization_id_seq
        INCREMENT 1
        START 1
        MINVALUE 1
        MAXVALUE 2147483647
        CACHE 1;

    CREATE TABLE IF NOT EXISTS public.organizations
    (
        organization_id integer NOT NULL DEFAULT nextval('organizations_organization_id_seq'::regclass),
        name character varying(128) COLLATE pg_catalog.default NOT NULL,
        email character varying(128) COLLATE pg_catalog.default,
        CONSTRAINT organizations_pkey PRIMARY KEY (organization_id),
        CONSTRAINT organizations_name UNIQUE (name)
    );

    CREATE SEQUENCE public.rsu_credentials_credential_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.rsu_credentials
    (
       credential_id integer NOT NULL DEFAULT nextval('rsu_credentials_credential_id_seq'::regclass),
       username character varying(128) COLLATE pg_catalog.default NOT NULL,
       password character varying(128) COLLATE pg_catalog.default NOT NULL,
       nickname character varying(128) COLLATE pg_catalog.default NOT NULL,
       owner_organization_id integer NOT NULL,
       CONSTRAINT rsu_credentials_pkey PRIMARY KEY (credential_id),
       CONSTRAINT rsu_credentials_nickname UNIQUE (nickname),
       CONSTRAINT fk_rsu_credential_owner_organization_id FOREIGN KEY (owner_organization_id)
          REFERENCES organizations (organization_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.snmp_credentials_snmp_credential_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.snmp_credentials
    (
       snmp_credential_id integer NOT NULL DEFAULT nextval('snmp_credentials_snmp_credential_id_seq'::regclass),
       username character varying(128) COLLATE pg_catalog.default NOT NULL,
       password character varying(128) COLLATE pg_catalog.default NOT NULL,
       encrypt_password character varying(128) COLLATE pg_catalog.default,
       nickname character varying(128) COLLATE pg_catalog.default NOT NULL,
       owner_organization_id integer NOT NULL,
       CONSTRAINT snmp_credentials_pkey PRIMARY KEY (snmp_credential_id),
       CONSTRAINT snmp_credentials_nickname UNIQUE (nickname),
       CONSTRAINT fk_snmp_credential_owner_organization_id FOREIGN KEY (owner_organization_id)
       REFERENCES organizations (organization_id) MATCH SIMPLE
       ON UPDATE NO ACTION
       ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.snmp_protocols_snmp_protocol_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.snmp_protocols
    (
       snmp_protocol_id integer NOT NULL DEFAULT nextval('snmp_protocols_snmp_protocol_id_seq'::regclass),
       protocol_code character varying(128) COLLATE pg_catalog.default NOT NULL,
       nickname character varying(128) COLLATE pg_catalog.default NOT NULL,
       CONSTRAINT snmp_protocols_pkey PRIMARY KEY (snmp_protocol_id),
       CONSTRAINT snmp_protocols_nickname UNIQUE (nickname)
    );

    CREATE SEQUENCE public.rsus_rsu_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.rsus
    (
       rsu_id integer NOT NULL DEFAULT nextval('rsus_rsu_id_seq'::regclass),
       geography geography NOT NULL,
       milepost double precision NOT NULL,
       ipv4_address inet NOT NULL,
       serial_number character varying(128) COLLATE pg_catalog.default NOT NULL,
       iss_scms_id character varying(128) COLLATE pg_catalog.default NOT NULL,
       primary_route character varying(128) COLLATE pg_catalog.default NOT NULL,
       model integer NOT NULL,
       credential_id integer NOT NULL,
       snmp_credential_id integer NOT NULL,
       snmp_protocol_id integer NOT NULL,
       firmware_version integer,
       target_firmware_version integer,
       CONSTRAINT rsu_pkey PRIMARY KEY (rsu_id),
       CONSTRAINT rsu_ipv4_address UNIQUE (ipv4_address),
       CONSTRAINT rsu_milepost_primary_route UNIQUE (milepost, primary_route),
       CONSTRAINT rsu_serial_number UNIQUE (serial_number),
       CONSTRAINT rsu_iss_scms_id UNIQUE (iss_scms_id),
       CONSTRAINT fk_model FOREIGN KEY (model)
          REFERENCES public.rsu_models (rsu_model_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_credential_id FOREIGN KEY (credential_id)
          REFERENCES public.rsu_credentials (credential_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_snmp_credential_id FOREIGN KEY (snmp_credential_id)
          REFERENCES public.snmp_credentials (snmp_credential_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_snmp_protocol_id FOREIGN KEY (snmp_protocol_id)
          REFERENCES public.snmp_protocols (snmp_protocol_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_firmware_version FOREIGN KEY (firmware_version)
          REFERENCES public.firmware_images (firmware_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_target_firmware_version FOREIGN KEY (target_firmware_version)
          REFERENCES public.firmware_images (firmware_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE TABLE IF NOT EXISTS public.rsu_options
    (
       rsu_id integer NOT NULL,
       tim_deposit boolean NOT NULL DEFAULT FALSE,
       snmp_monitoring boolean NOT NULL DEFAULT FALSE,
       CONSTRAINT rsu_options_pkey PRIMARY KEY (rsu_id),
       CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
          REFERENCES public.rsus (rsu_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.ping_ping_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.ping
    (
       ping_id integer NOT NULL DEFAULT nextval('ping_ping_id_seq'::regclass),
       timestamp timestamp without time zone NOT NULL,
       result bit(1) NOT NULL,
       rsu_id integer NOT NULL,
       CONSTRAINT ping_pkey PRIMARY KEY (ping_id),
       CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
          REFERENCES public.rsus (rsu_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.roles_role_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.roles
    (
       role_id integer NOT NULL DEFAULT nextval('roles_role_id_seq'::regclass),
       name character varying(128) COLLATE pg_catalog.default NOT NULL,
       CONSTRAINT roles_pkey PRIMARY KEY (role_id),
       CONSTRAINT roles_name UNIQUE (name)
    );

    CREATE SEQUENCE public.users_user_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.users
    (
       user_id integer NOT NULL DEFAULT nextval('users_user_id_seq'::regclass),
       keycloak_id UUID NOT NULL DEFAULT uuid_generate_v4(),
       email character varying(128) COLLATE pg_catalog.default NOT NULL,
       first_name character varying(128),
       last_name character varying(128),
       created_timestamp bigint NOT NULL,
       super_user bit(1) DEFAULT 0::bit NOT NULL,
       CONSTRAINT users_pkey PRIMARY KEY (user_id),
       CONSTRAINT users_email UNIQUE (email)
    );

    CREATE SEQUENCE public.user_organization_user_organization_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.user_organization
    (
       user_organization_id integer NOT NULL DEFAULT nextval('user_organization_user_organization_id_seq'::regclass),
       user_id integer NOT NULL,
       organization_id integer NOT NULL,
       role_id integer NOT NULL,
       CONSTRAINT user_organization_pkey PRIMARY KEY (user_organization_id),
       CONSTRAINT fk_user_id FOREIGN KEY (user_id)
          REFERENCES public.users (user_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_organization_id FOREIGN KEY (organization_id)
          REFERENCES public.organizations (organization_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_role_id FOREIGN KEY (role_id)
          REFERENCES public.roles (role_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.rsu_organization_rsu_organization_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.rsu_organization
    (
       rsu_organization_id integer NOT NULL DEFAULT nextval('rsu_organization_rsu_organization_id_seq'::regclass),
       rsu_id integer NOT NULL,
       organization_id integer NOT NULL,
       CONSTRAINT rsu_organization_pkey PRIMARY KEY (rsu_organization_id),
       CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
          REFERENCES public.rsus (rsu_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_organization_id FOREIGN KEY (organization_id)
          REFERENCES public.organizations (organization_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE VIEW public.rsu_organization_name AS
    SELECT ro.rsu_id, org.name
    FROM public.rsu_organization AS ro
    JOIN public.organizations AS org ON ro.organization_id = org.organization_id;

    CREATE SEQUENCE public.iss_keys_iss_key_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.iss_keys
    (
       iss_key_id integer NOT NULL DEFAULT nextval('iss_keys_iss_key_id_seq'::regclass),
       common_name character varying(128) COLLATE pg_catalog.default NOT NULL,
       token character varying(128) COLLATE pg_catalog.default NOT NULL,
       CONSTRAINT iss_keys_pkey PRIMARY KEY (iss_key_id)
    );

    CREATE SEQUENCE public.scms_health_scms_health_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.scms_health
    (
       scms_health_id integer NOT NULL DEFAULT nextval('scms_health_scms_health_id_seq'::regclass),
       timestamp timestamp without time zone NOT NULL,
       health bit(1) NOT NULL,
       expiration timestamp without time zone,
       rsu_id integer NOT NULL,
       CONSTRAINT scms_health_pkey PRIMARY KEY (scms_health_id),
       CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
          REFERENCES public.rsus (rsu_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.rsu_health_rsu_health_id_seq
        INCREMENT 1
        START 1
        MINVALUE 1
        MAXVALUE 2147483647
        CACHE 1;

    CREATE TABLE IF NOT EXISTS public.rsu_health
    (
        rsu_health_id integer NOT NULL DEFAULT nextval('rsu_health_rsu_health_id_seq'::regclass),
        timestamp timestamp without time zone NOT NULL,
        health integer NOT NULL,
        rsu_id integer NOT NULL,
        CONSTRAINT rsu_health_pkey PRIMARY KEY (rsu_health_id),
        CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
            REFERENCES public.rsus (rsu_id) MATCH SIMPLE
            ON UPDATE NO ACTION
            ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.snmp_msgfwd_type_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.snmp_msgfwd_type
    (
       snmp_msgfwd_type_id integer NOT NULL DEFAULT nextval('snmp_msgfwd_type_id_seq'::regclass),
       name character varying(128) COLLATE pg_catalog.default NOT NULL,
       CONSTRAINT snmp_msgfwd_type_pkey PRIMARY KEY (snmp_msgfwd_type_id),
       CONSTRAINT snmp_msgfwd_type_name UNIQUE (name)
    );

    CREATE TABLE IF NOT EXISTS public.snmp_msgfwd_config
    (
       rsu_id integer NOT NULL,
       msgfwd_type integer NOT NULL,
       snmp_index integer NOT NULL,
       message_type character varying(128) COLLATE pg_catalog.default NOT NULL,
       dest_ipv4 inet NOT NULL,
       dest_port integer NOT NULL,
       start_datetime timestamp without time zone NOT NULL,
       end_datetime timestamp without time zone NOT NULL,
       active bit(1) NOT NULL,
       security bit(1) NOT NULL,
       CONSTRAINT snmp_msgfwd_config_pkey PRIMARY KEY (rsu_id, msgfwd_type, snmp_index),
       CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
          REFERENCES public.rsus (rsu_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_msgfwd_type FOREIGN KEY (msgfwd_type)
          REFERENCES public.snmp_msgfwd_type (snmp_msgfwd_type_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.email_type_email_type_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.email_type
    (
       email_type_id integer NOT NULL DEFAULT nextval('email_type_email_type_id_seq'::regclass),
       email_type character varying(128) COLLATE pg_catalog.default NOT NULL,
       description character varying(256) COLLATE pg_catalog.default,
       supports_immediate boolean DEFAULT true NOT NULL,
       supports_hourly boolean DEFAULT false NOT NULL,
       supports_daily boolean DEFAULT false NOT NULL,
       supports_weekly boolean DEFAULT false NOT NULL,
       supports_monthly boolean DEFAULT false NOT NULL,
       CONSTRAINT email_type_pkey PRIMARY KEY (email_type_id),
       CONSTRAINT email_type_unique UNIQUE (email_type),
       CONSTRAINT at_least_one_frequency CHECK (supports_immediate OR supports_hourly OR supports_daily OR supports_weekly OR supports_monthly)
    );

    CREATE SEQUENCE public.user_email_notification_user_email_notification_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.user_email_notification
    (
       user_email_notification_id integer NOT NULL DEFAULT nextval('user_email_notification_user_email_notification_id_seq'::regclass),
       user_id integer NOT NULL,
       email_type_id integer NOT NULL,
       immediate boolean DEFAULT true NOT NULL,
       hourly boolean DEFAULT false NOT NULL,
       daily boolean DEFAULT false NOT NULL,
       weekly boolean DEFAULT false NOT NULL,
       monthly boolean DEFAULT false NOT NULL,
       CONSTRAINT user_email_notification_pkey PRIMARY KEY (user_email_notification_id),
       CONSTRAINT user_email_notification_unique UNIQUE (user_id, email_type_id),
       CONSTRAINT at_least_one_subscription CHECK (immediate OR hourly OR daily OR weekly OR monthly),
       CONSTRAINT fk_user_id FOREIGN KEY (user_id)
          REFERENCES public.users (user_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE CASCADE,
       CONSTRAINT fk_email_type_id FOREIGN KEY (email_type_id)
          REFERENCES public.email_type (email_type_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE CASCADE
    );

    CREATE SEQUENCE public.obu_ota_request_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.obu_ota_requests (
       request_id integer NOT NULL DEFAULT nextval('obu_ota_request_id_seq'::regclass),
       obu_sn character varying(128) NOT NULL,
       request_datetime timestamp NOT NULL,
       origin_ip inet NOT NULL,
       obu_firmware_version varchar(128) NOT NULL,
       requested_firmware_version varchar(128) NOT NULL,
       error_status bit(1) NOT NULL,
       error_message varchar(128) NOT NULL,
       manufacturer int4 NOT NULL,
       CONSTRAINT obu_ota_requests_pkey PRIMARY KEY (request_id),
       CONSTRAINT fk_manufacturer FOREIGN KEY (manufacturer) REFERENCES public.manufacturers(manufacturer_id)
    );

    CREATE SEQUENCE public.intersections_intersection_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.intersections
    (
       intersection_id integer NOT NULL DEFAULT nextval('intersections_intersection_id_seq'::regclass),
       intersection_number character varying(128) NOT NULL,
       ref_pt GEOGRAPHY(POINT, 4326) NOT NULL,
       bbox GEOGRAPHY(POLYGON, 4326),
       intersection_name character varying(128),
       origin_ip inet,
       CONSTRAINT intersection_pkey PRIMARY KEY (intersection_id),
       CONSTRAINT intersection_intersection_number UNIQUE (intersection_number)
    );

    CREATE SEQUENCE public.intersection_organization_intersection_organization_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.intersection_organization
    (
       intersection_organization_id integer NOT NULL DEFAULT nextval('intersection_organization_intersection_organization_id_seq'::regclass),
       intersection_id integer NOT NULL,
       organization_id integer NOT NULL,
       CONSTRAINT intersection_organization_pkey PRIMARY KEY (intersection_organization_id),
       CONSTRAINT fk_intersection_id FOREIGN KEY (intersection_id)
          REFERENCES public.intersections (intersection_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_organization_id FOREIGN KEY (organization_id)
          REFERENCES public.organizations (organization_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE SEQUENCE public.rsu_intersection_rsu_intersection_id_seq
       INCREMENT 1
       START 1
       MINVALUE 1
       MAXVALUE 2147483647
       CACHE 1;

    CREATE TABLE IF NOT EXISTS public.rsu_intersection
    (
       rsu_intersection_id integer NOT NULL DEFAULT nextval('rsu_intersection_rsu_intersection_id_seq'::regclass),
       rsu_id integer NOT NULL,
       intersection_id integer NOT NULL,
       CONSTRAINT rsu_intersection_pkey PRIMARY KEY (rsu_intersection_id),
       CONSTRAINT rsu_intersection_unique UNIQUE (rsu_id, intersection_id),
       CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
          REFERENCES public.rsus (rsu_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_intersection_id FOREIGN KEY (intersection_id)
          REFERENCES public.intersections (intersection_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE TABLE IF NOT EXISTS public.consecutive_firmware_upgrade_failures
    (
       rsu_id integer NOT NULL,
       consecutive_failures integer NOT NULL,
       CONSTRAINT consecutive_firmware_upgrade_failures_pkey PRIMARY KEY (rsu_id),
       CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
          REFERENCES public.rsus (rsu_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    CREATE TABLE IF NOT EXISTS public.max_retry_limit_reached_instances
    (
       rsu_id integer NOT NULL,
       reached_at timestamp without time zone NOT NULL,
       target_firmware_version integer NOT NULL,
       CONSTRAINT max_retry_limit_reached_instances_pkey PRIMARY KEY (rsu_id, reached_at),
       CONSTRAINT fk_rsu_id FOREIGN KEY (rsu_id)
          REFERENCES public.rsus (rsu_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION,
       CONSTRAINT fk_target_firmware_version FOREIGN KEY (target_firmware_version)
          REFERENCES public.firmware_images (firmware_id) MATCH SIMPLE
          ON UPDATE NO ACTION
          ON DELETE NO ACTION
    );

    -- Indexes
    CREATE INDEX idx_organizations_name ON public.organizations (name);

    -- RSUs
    CREATE INDEX idx_rsu_organization ON public.rsu_organization (organization_id, rsu_id);
    CREATE INDEX idx_rsus_ipv4_address ON public.rsus (ipv4_address);
    CREATE INDEX idx_rsus_ipv4_rsu_id ON public.rsus (ipv4_address, rsu_id);

    -- Intersections
    CREATE INDEX idx_intersections_intersection_number ON public.intersections (intersection_number);
    CREATE INDEX idx_intersection_id ON public.intersections (intersection_id);
    CREATE INDEX idx_intersection_organization ON public.intersection_organization (organization_id, intersection_id);

    -- Users
    CREATE INDEX idx_users_email ON public.users (email);
    CREATE INDEX idx_users_user_id ON public.users (user_id);
    CREATE INDEX idx_user_organization ON public.user_organization (user_id, organization_id);

    -- SCMS health
    CREATE INDEX IF NOT EXISTS idx_scms_health_timestamp ON public.scms_health (timestamp);

    COMMIT;
  V202605211729__add_table_comments.sql: |
    -- V202605211729__add_table_comments.sql
    -- Adds COMMENT ON TABLE / COLUMN for all tables and the rsu_organization_name view.
    -- Preserves documentation previously maintained only in resources/deprecated/sql_scripts/README.md.
    --
    -- Each statement is wrapped in a DO block that silently skips if the object does not exist.
    -- This tolerates databases that were baselined at V1 before all update scripts were applied.

    BEGIN;

    -- Firmware / hardware catalog
    DO $$ BEGIN COMMENT ON TABLE public.manufacturers IS
        'RSU and OBU manufacturers supported by this deployment. Tested manufacturers: Commsignia, Kapsch, Yunex.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.rsu_models IS
        'RSU hardware models. Each model is linked to a manufacturer and identifies firmware upgrade availability.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.firmware_images IS
        'Known RSU firmware packages. Stores the information the API needs to retrieve and install firmware on an RSU.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.firmware_upgrade_rules IS
        'Valid firmware upgrade paths. A from_id->to_id row means an RSU on from_id firmware can upgrade directly to to_id. Without a matching row the upgrade is blocked to prevent skipping intermediate versions.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- Credentials
    DO $$ BEGIN COMMENT ON TABLE public.rsu_credentials IS
        'SSH credentials for RSU remote access (reboots, firmware upgrades). Referenced by nickname so credentials are never transmitted over the network.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.snmp_credentials IS
        'SNMP credentials for RSU message forwarding configuration. Referenced by nickname so credentials are never transmitted over the network.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.snmp_protocols IS
        'SNMP protocol versions used by RSUs for message forwarding. Referenced by nickname.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- Core RSU data
    DO $$ BEGIN COMMENT ON TABLE public.rsus IS
        'All RSUs managed by this deployment. Each row appears on the CV Manager map. primary_route is a denormalized field stored here rather than in a separate table.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON COLUMN public.rsus.primary_route IS
        'Denormalized route name (e.g., I-25, US-36). No separate route table exists.';
    EXCEPTION WHEN undefined_table OR undefined_column THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.rsu_options IS
        'Per-RSU feature flags. tim_deposit enables TIM message depositing; snmp_monitoring enables SNMP-based health monitoring for this RSU.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- Health / status
    DO $$ BEGIN COMMENT ON TABLE public.ping IS
        'RSU online/offline ping results. Keep at most 24 hours of records per RSU (or only the most recent record per RSU). Allowing this table to grow large degrades CV Manager map load times. Populated by Zabbix or an automated ping script.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.rsu_health IS
        'RSU health status records collected via SNMP monitoring. Similar to ping — keep recent data only to avoid performance impact on the map.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.scms_health IS
        'ISS SCMS certificate health status per RSU. Populated by polling the ISS SCMS API every 6 hours. Requires an active ISS SCMS service agreement.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.iss_keys IS
        'ISS SCMS API authentication tokens used by the iss_health_check service to query certificate status on behalf of RSUs.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- Users and organizations
    DO $$ BEGIN COMMENT ON TABLE public.roles IS
        'User roles assignable within an organization. Three rows are required by the application: admin, operator, and user. Do not rename or remove these rows.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON COLUMN public.roles.name IS
        'Required values: ''admin'', ''operator'', ''user''. The application depends on these exact role names.';
    EXCEPTION WHEN undefined_table OR undefined_column THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.users IS
        'Users authorized to access the CV Manager. Keycloak is the identity provider; keycloak_id links to the Keycloak user record. Users with super_user=1 can access the admin panel across all organizations.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON COLUMN public.users.super_user IS
        '1 = user can access the admin panel and manage resources across all organizations. 0 = normal user.';
    EXCEPTION WHEN undefined_table OR undefined_column THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.organizations IS
        'Deployment organizations. Users and RSUs are scoped to organizations; a user can only access RSUs within their own organizations.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.user_organization IS
        'Many-to-many assignment of users to organizations, with a role per membership.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.rsu_organization IS
        'Many-to-many assignment of RSUs to organizations.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- SNMP message forwarding
    DO $$ BEGIN COMMENT ON TABLE public.snmp_msgfwd_type IS
        'Lookup table for SNMP message forwarding types (e.g., RX, TX).';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.snmp_msgfwd_config IS
        'Active SNMP message forwarding rules per RSU. Defines which message types to forward, to what destination IP/port, and over what time window.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- Email notifications
    DO $$ BEGIN COMMENT ON TABLE public.email_type IS
        'Lookup table for notification email categories available for user subscription.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.user_email_notification IS
        'User subscriptions to email notification types, including per-subscription frequency settings.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- OBU
    DO $$ BEGIN COMMENT ON TABLE public.obu_ota_requests IS
        'Over-the-air firmware update requests for OBU (On-Board Unit) devices.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- Intersections
    DO $$ BEGIN COMMENT ON TABLE public.intersections IS
        'Managed signalized intersections used by the intersection management features.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.intersection_organization IS
        'Many-to-many assignment of intersections to organizations.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.rsu_intersection IS
        'Association between RSUs and nearby intersections.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- Firmware retry tracking
    DO $$ BEGIN COMMENT ON TABLE public.consecutive_firmware_upgrade_failures IS
        'Tracks consecutive firmware upgrade failure counts per RSU, used to enforce retry limits before escalating.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    DO $$ BEGIN COMMENT ON TABLE public.max_retry_limit_reached_instances IS
        'Records instances where an RSU has reached the configured maximum consecutive firmware upgrade failure limit.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    -- View
    DO $$ BEGIN COMMENT ON VIEW public.rsu_organization_name IS
        'Convenience view joining rsu_organization with organization names for display in the CV Manager UI.';
    EXCEPTION WHEN undefined_table THEN NULL; END $$;

    COMMIT;
---
# ConfigMap containing the Flyway configuration file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-conf
data:
  flyway.toml: |
    [flyway]
    locations = ["filesystem:/flyway/sql"]
    outOfOrder = true
    baselineOnMigrate = true
    baselineVersion = "1"
    validateMigrationNaming = true
    mixed = true
---
# Job that runs Flyway migrations before the CV Manager API starts.
# Apply this before scaling up cv-manager-api. The API's init container
# waits for a successful row in flyway_schema_history before starting.
#
# To add a new migration:
# 1. Create V{YYYYMMDDHHMM}__description.sql in resources/db/migration/
# 2. Add a matching key in the flyway-sql ConfigMap above
# 3. Delete the completed Job and re-apply: kubectl delete job cv-manager-flyway-migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: cv-manager-flyway-migrate
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: flyway/flyway:10-alpine
          command: ["flyway", "migrate"]
          env:
            # Fill in PG_DB_NAME to match the value used in cv-manager-api.yaml
            - name: PG_DB_NAME
              value: ""
            - name: FLYWAY_URL
              value: jdbc:postgresql://cv-manager-postgres-svc:5432/$(PG_DB_NAME)
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: some-postgres-secret-user
                  key: some-postgres-secret-key
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: some-postgres-secret-password
                  key: some-postgres-secret-key
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
            - name: flyway-conf
              mountPath: /flyway/conf/flyway.toml
              subPath: flyway.toml
      volumes:
        - name: flyway-sql
          configMap:
            name: flyway-sql
        - name: flyway-conf
          configMap:
            name: flyway-conf
