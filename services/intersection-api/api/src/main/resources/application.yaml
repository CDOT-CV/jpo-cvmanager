# application configuration
server:
  port: 8089
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

### keycloak configuration
keycloak:
  realm: cvmanager
  auth-server-url: ${AUTH_SERVER_URL}
  client-id: ${KEYCLOAK_CLIENT_API_ID}
  client-secret: ${KEYCLOAK_CLIENT_API_SECRET}

spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${AUTH_SERVER_URL}/realms/cvmanager
  jwk-set-uri: ${AUTH_SERVER_URL}/realms/cvmanager/protocol/openid-connect/certs

spring.kafka.bootstrap-servers: ${KAFKA_BROKER_IP:localhost}:${KAFKA_BROKER_PORT:9092}
logging.level.org.apache.kafka: INFO
logging.level: INFO

schema.bsm: classpath:schemas/bsm.schema.json
schema.map: classpath:schemas/map.schema.json
schema.spat: classpath:schemas/spat.schema.json
schema.psm: classpath:schemas/psm.schema.json

# Amount of time to wait to try and increase batching
kafka.linger_ms: 50

kafka.topics:
  autoCreateTopics: false
  numPartitions: 1
  numReplicas: 1
  createTopics:
    - name: topic.ProcessedSpat
      cleanupPolicy: delete
      retentionMs: 300000
    - name: topic.ProcessedMap
      cleanupPolicy: delete
      retentionMs: 300000

conflict:
  monitor:
    api:
      kafka-consumers-always-on: false

# MongoDB Configuration
spring:
  data:
    mongodb:
      database: ${CM_DATABASE_NAME:CV}
      host: ${DB_HOST_IP:localhost}
      port: 27017
      username: ${MONGO_READ_WRITE_USER:api}
      password: ${MONGO_READ_WRITE_PASS:api}
      authenticationDatabase: ${CM_MONGO_AUTH_DB:admin}
      uri: ${CM_MONGO_URI:null}
  # Postgres Configuration
  datasource:
    url: ${POSTGRES_SERVER_URL:jdbc:postgresql://localhost:5432}/postgres
    username: ${PG_DB_USER:postgres}
    password: ${PG_DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
  ### Spring Mail Settings (If using emailBroker SMTP)
  mail:
    host: ${INTERSECTION_SMTP_SERVER_IP:localhost}
    port: ${INTERSECTION_SMTP_SERVER_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: true

enable:
  api: ${INTERSECTION_API_ENABLE_API:true}
  email: ${INTERSECTION_API_ENABLE_EMAILER:true}
  report: ${INTERSECTION_API_ENABLE_REPORTS:true}
  haas: ${INTERSECTION_API_ENABLE_HAAS:true}

cmServerURL: ${CM_SERVER_URL:http://localhost:8082}
mongoTimeoutMs: ${CM_MONGO_TIMEOUT_MS:5000}
cors: '*'
maximumResponseSize: ${CM_MAXIMUM_RESPONSE_SIZE:10000}

spring.main.allow-circular-references: true

server.servlet.context-path: ${BASE_ROUTE_PREFIX:/}

### General Email Settings

# Email Broker Options: sendgrid, postmark, anything else will use generic SMTP mail server.
emailBroker: ${INTERSECTION_EMAIL_BROKER:""}
emailFromAddress: ${INTERSECTION_SENDER_EMAIL:""}

### SendGrid Email Settings
sendgrid:
  username: ${SENDGRID_USERNAME:""}
  password: ${SENDGRID_PASSWORD:""}

### Postmark Email Settings
postmark.api.secretKey: ${CM_POSTMARK_SECRET_KEY:""}

# Firmware Management Configuration
firmware:
  # Storage configuration - set via FIRMWARE_STORAGE_TYPE environment variable
  storage:
    type: ${FIRMWARE_STORAGE_TYPE:local} # local, gcp, aws, azure

    # Local file system storage (for local deployments)
    local:
      base-path: ${FIRMWARE_LOCAL_BASE_PATH:/tmp/firmware}
      max-file-size: ${FIRMWARE_LOCAL_MAX_FILE_SIZE:100MB}
      allowed-extensions: ${FIRMWARE_LOCAL_ALLOWED_EXTENSIONS:.bin,.img,.tar,.gz,.zip}

    # GCP Cloud Storage configuration
    gcp:
      bucket-name: ${FIRMWARE_GCP_BUCKET:cv-manager-firmware}
      project-id: ${FIRMWARE_GCP_PROJECT_ID:}
      service-account-key: ${FIRMWARE_GCP_SERVICE_ACCOUNT_KEY:}
      base-path: ${FIRMWARE_GCP_BASE_PATH:firmware/}

    # AWS S3 configuration
    aws:
      bucket-name: ${FIRMWARE_AWS_BUCKET:cv-manager-firmware}
      region: ${FIRMWARE_AWS_REGION:us-east-1}
      access-key: ${FIRMWARE_AWS_ACCESS_KEY:}
      secret-key: ${FIRMWARE_AWS_SECRET_KEY:}
      base-path: ${FIRMWARE_AWS_BASE_PATH:firmware/}

    # Azure Blob Storage configuration
    azure:
      account-name: ${FIRMWARE_AZURE_ACCOUNT_NAME:}
      account-key: ${FIRMWARE_AZURE_ACCOUNT_KEY:}
      container-name: ${FIRMWARE_AZURE_CONTAINER:firmware}
      base-path: ${FIRMWARE_AZURE_BASE_PATH:firmware/}

  # Firmware Scheduler integration
  scheduler:
    base-url: ${FIRMWARE_SCHEDULER_URL:http://localhost:8080}
    timeout: ${FIRMWARE_SCHEDULER_TIMEOUT:30000}
    health-check-interval: ${FIRMWARE_SCHEDULER_HEALTH_CHECK_INTERVAL:60000}
    retry-attempts: ${FIRMWARE_SCHEDULER_RETRY_ATTEMPTS:3}
    retry-delay: ${FIRMWARE_SCHEDULER_RETRY_DELAY:5000}

  # File validation
  validation:
    max-file-size: ${FIRMWARE_VALIDATION_MAX_FILE_SIZE:100MB}
    allowed-extensions: ${FIRMWARE_VALIDATION_ALLOWED_EXTENSIONS:.bin,.img,.tar,.gz,.zip}
    checksum-algorithm: ${FIRMWARE_VALIDATION_CHECKSUM_ALGORITHM:SHA-256}
    virus-scan: ${FIRMWARE_VALIDATION_VIRUS_SCAN:false}

  # Security
  security:
    require-authentication: ${FIRMWARE_SECURITY_REQUIRE_AUTH:true}
    allowed-roles: ${FIRMWARE_SECURITY_ALLOWED_ROLES:admin,firmware-manager}
    audit-logging: ${FIRMWARE_SECURITY_AUDIT_LOGGING:true}

  # Performance
  performance:
    cache-duration: ${FIRMWARE_PERFORMANCE_CACHE_DURATION:300000} # 5 minutes
    batch-size: ${FIRMWARE_PERFORMANCE_BATCH_SIZE:100}
    async-processing: ${FIRMWARE_PERFORMANCE_ASYNC_PROCESSING:true}
