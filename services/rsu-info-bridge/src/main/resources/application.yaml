spring:
  application:
    name: rsu-info-bridge
  docker:
    compose:
      file: ../../docker-compose.yml
      profiles:
        active: cvmanager_postgres
  datasource:
    url: ${POSTGRES_SERVER_URL:jdbc:postgresql://localhost:5432}/${POSTGRES_DB:postgres}
    username: ${PG_DB_USER:postgres}
    password: ${PG_DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: ${RSU_INFO_BRIDGE_PORT:16543}