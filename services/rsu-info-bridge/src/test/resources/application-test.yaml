spring:
  application:
    name: rsu-info-bridge-test
  flyway:
    locations: classpath:db/migration
    mixed: true
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
