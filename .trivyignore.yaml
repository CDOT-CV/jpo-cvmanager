# Trivy vulnerability suppressions for the CVE scan gate. See docs/cve-scanning.md.
# Every entry needs an id, a purls (or paths) scope, a statement giving the reason,
# owner and tracking issue, and an expired_at no more than 180 days out.
# purls omit the version and qualifiers, so an entry keeps applying when the
# package moves to another still-vulnerable version (for example, a refreshed
# base image ships a newer release that has a fix available).
#
# The gate currently blocks on CRITICAL only; HIGH will be added later (see
# docs/cve-scanning.md). Rollout baseline: pre-existing fixable CRITICAL findings
# (8 entries), expiring 2026-11-30.
# Comments list severity, fixed version(s) and affected scan targets.
vulnerabilities:
  # CRITICAL; no Debian 13 fix yet; firmware-upgrade-runner
  - id: CVE-2026-114820
    purls: ['pkg:deb/debian/openjdk-21-jre-headless']
    statement: >-
      Temporary risk deferral in PR #429 while Debian 13 lacks a fixed package.
      Keep the packaged JRE visible to Trivy rather than copying an unscanned runtime.
      Java runs the vendor XFER CLI for outbound firmware uploads to RSUs on port 3600;
      reachability of the vulnerable JSSE path has not been ruled out. Remove this
      entry after installing and verifying the Debian security update.
      Owner: @drewjj. Tracking: https://github.com/CDOT-CV/jpo-cvmanager/pull/429.
    expired_at: 2026-12-15
